<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呉服町 → 姪浜方面</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
            background: #e8edf2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 16px;
            color: #1a2a3a;
        }

        .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .tab {
            background: #d1d5db; color: #4b5563;
            border: none; padding: 8px 18px; border-radius: 20px;
            cursor: pointer; font-size: 0.85rem; font-weight: 600;
            transition: background 0.15s, color 0.15s;
        }
        .tab.active { background: #1a2a3a; color: white; }

        header { text-align: center; margin-bottom: 10px; }
        header h1 { font-size: 1.3rem; font-weight: 700; }

        .clock {
            font-size: 3.8rem;
            font-weight: 200;
            letter-spacing: 3px;
            font-variant-numeric: tabular-nums;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .badge.weekday { background: #dbeafe; color: #1d4ed8; }
        .badge.holiday { background: #fce7f3; color: #be185d; }

        .btn {
            background: #1a2a3a;
            color: white;
            border: none;
            padding: 16px 52px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 0;
            transition: transform 0.1s, opacity 0.1s;
        }
        .btn:active { transform: scale(0.96); opacity: 0.85; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 16px; }
        .btn-sub { background: #4b5563; padding: 16px 20px; }

        .trains { width: 100%; max-width: 420px; }

        .card {
            background: white;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 8px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.07);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .card.first { border-left: 5px solid #1a2a3a; }

        .card-left { flex: 1; }
        .card-label { font-size: 0.72rem; color: #9ca3af; margin-bottom: 2px; }
        .card-times { display: flex; align-items: baseline; gap: 10px; }
        .card-time  { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
        .card-arrival { font-size: 1rem; color: #6b7a8d; font-weight: 500; font-variant-numeric: tabular-nums; }
        .card-conn  { font-size: 0.78rem; color: #9ca3af; margin-top: 2px; }
        .card-wait  { font-size: 0.82rem; color: #6b7a8d; margin-top: 3px; }

        .dest {
            font-size: 1rem;
            font-weight: 700;
            padding: 6px 13px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .dest-direct   { background: #dcfce7; color: #15803d; }
        .dest-transfer { background: #f3f4f6; color: #4b5563; }

        .card-dest { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .platform { font-size: 1rem; font-weight: 700; padding: 6px 13px; border-radius: 20px; white-space: nowrap; }
        .plat-3  { background: #dbeafe; color: #1d4ed8; }
        .plat-12 { background: #e5e7eb; color: #4b5563; }

        .card.past { opacity: 0.45; }

        .empty {
            text-align: center;
            color: #9ca3af;
            padding: 20px 0;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="tabs">
    <button class="tab active" id="tab-out" onclick="setDirection('outbound')">呉服町 → 姪浜</button>
    <button class="tab"        id="tab-ret" onclick="setDirection('return')">姪浜 → 呉服町</button>
</div>

<header>

</header>

<div class="clock" id="clock">--:--</div>
<div class="badge" id="badge"></div>

<div class="btn-row">

    <button class="btn" onclick="showNext()">次の電車を確認</button>

</div>

function getDayType(date) {
    const d = date.getDay();
    return (d === 0 || d === 6) ? 'holiday' : 'weekday';
}

function pad(n) { return String(n).padStart(2, '0'); }

function arrivalTime(hr, min, duration) {
    let ah = hr, am = min + duration;
    if (am >= 60) { ah++; am -= 60; }
    if (ah >= 24) ah -= 24;
    return pad(ah) + ':' + pad(am);
}

// 中洲川端着後の接続を検索。{ connHr, connMin, arrHr, arrMin } を返す
function findConnection(deptHr, deptMin) {
    const type  = getDayType(new Date());
    const table = nakasuTimetable[type];
    const adjH  = deptHr < 5 ? deptHr + 24 : deptHr;
    const ref   = adjH * 60 + deptMin + 1; // 中洲川端着
    for (let hr = 5; hr <= 24; hr++) {
        const key    = hr === 24 ? 0 : hr;
        const trains = table[key];
        if (!trains) continue;
        for (const t of trains) {
            if (hr * 60 + t.m > ref) {
                const finTotal = hr * 60 + t.m + 16;
                return {
                    connHr:  key,
                    connMin: t.m,
                    finHr:   Math.floor(finTotal / 60) % 24,
                    finMin:  finTotal % 60,
                };
            }
        }
    }
    return null;
}

function isDirectTrain(hr, min) {
    const type  = getDayType(new Date());
    const table = hakazakiReturnTimetable[type];
    const base  = (hr < 5 ? hr + 24 : hr) * 60 + min + 15;
    for (let d = -1; d <= 1; d++) {
        const tot = base + d;
        const key = Math.floor(tot / 60) % 24;
        if ((table[key] || []).some(e => e.m === tot % 60)) return true;
    }
    return false;
}

function destBadge(isDirect) {
    return isDirect
        ? { label: '直通', cls: 'dest-direct' }
        : { label: '乗換', cls: 'dest-transfer' };
}

function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
        pad(now.getHours()) + ':' + pad(now.getMinutes());
    const type  = getDayType(now);
    const badge = document.getElementById('badge');
    badge.textContent = type === 'weekday' ? '平日ダイヤ' : '土曜・休日ダイヤ';
    badge.className   = 'badge ' + (type === 'weekday' ? 'weekday' : 'holiday');
}

let trainOffset = 0;
let trainShown  = false;
let direction   = 'outbound'; // 'outbound' | 'return'

function setDirection(dir) {
    direction = dir;
    document.getElementById('tab-out').classList.toggle('active', dir === 'outbound');
    document.getElementById('tab-ret').classList.toggle('active', dir === 'return');
    document.getElementById('h1-title').textContent =
        dir === 'outbound' ? '呉服町 → 姪浜' : '姪浜 → 呉服町';
    trainShown = false;
    document.getElementById('trains').innerHTML = '';
}

function getAllTrains() {
    const now      = new Date();
    const h        = now.getHours();
    const m        = now.getMinutes();
    const nowTotal = (h < 5 ? h + 24 : h) * 60 + m;
    const type     = getDayType(now);
    const table    = direction === 'return' ? meinohamaTimetable[type] : timetable[type];
    const all      = [];
    for (let hr = 5; hr <= 24; hr++) {
        const key    = hr === 24 ? 0 : hr;
        const trains = table[key];
        if (!trains) continue;
        for (const t of trains)
            all.push({ hr: key, min: t.m, dest: t.d || '', direct: !!t.k, plat3: !!t.p, diff: hr * 60 + t.m - nowTotal });
    }
    return all;
}

// 姪浜発 → 中洲川端着後の箱崎線接続を検索
function findReturnConnection(deptHr, deptMin) {
    const type  = getDayType(new Date());
    const table = hakazakiReturnTimetable[type];
    const adjH  = deptHr < 5 ? deptHr + 24 : deptHr;
    const ref   = adjH * 60 + deptMin + 15; // 中洲川端着（姪浜+15分）
    for (let hr = 5; hr <= 24; hr++) {
        const key    = hr === 24 ? 0 : hr;
        const trains = table[key];
        if (!trains) continue;
        for (const t of trains) {
            if (hr * 60 + t.m > ref) {
                const finTotal = hr * 60 + t.m + 1;
                return {
                    connHr:  key,
                    connMin: t.m,
                    finHr:   Math.floor(finTotal / 60) % 24,
                    finMin:  finTotal % 60,
                };
            }
        }
    }
    return null;
}

function renderAt(offset) {
    const all       = getAllTrains();
    const container = document.getElementById('trains');
    const nextIdx   = all.findIndex(t => t.diff > 0);
    if (nextIdx === -1) {
        trainOffset = 0; trainShown = false;
        container.innerHTML = '<div class="empty">本日の電車は終了しました</div>';
        return;
    }
    trainOffset = Math.max(0, Math.min(offset, all.length - 1));
    trainShown  = true;
    container.innerHTML = all.slice(trainOffset, trainOffset + 3).map((t, i) => {
        const isPast      = t.diff <= 0;
        const isNextTrain = trainOffset + i === nextIdx;
        const wait        = isPast ? '発車済' : (t.diff <= 1 ? 'まもなく発車' : `あと ${t.diff} 分`);

        let isDirect, arrivalHtml, connHtml;
        if (direction === 'return') {
            isDirect = t.direct || isDirectTrain(t.hr, t.min);
            if (isDirect) {
                arrivalHtml = `着 ${arrivalTime(t.hr, t.min, 16)}`;
                connHtml    = '';
            } else {
                const conn = findReturnConnection(t.hr, t.min);
                arrivalHtml = conn ? `着 ${pad(conn.finHr)}:${pad(conn.finMin)}` : '接続なし';
                connHtml    = conn ? `<div class="card-conn">接続 中洲川端 ${pad(conn.connHr)}:${pad(conn.connMin)} 発</div>` : '';
            }
        } else {
            isDirect = t.dest !== '';
            if (isDirect) {
                arrivalHtml = `着 ${arrivalTime(t.hr, t.min, 17)}`;
                connHtml    = '';
            } else {
                const conn = findConnection(t.hr, t.min);
                arrivalHtml = conn ? `着 ${pad(conn.finHr)}:${pad(conn.finMin)}` : '接続なし';
                connHtml    = conn ? `<div class="card-conn">接続 中洲川端 ${pad(conn.connHr)}:${pad(conn.connMin)} 発</div>` : '';
            }
        }
        const { label, cls } = destBadge(isDirect);
        const showPlat = direction === 'return';
        const platHtml = showPlat
            ? (t.plat3
                ? `<div class="platform plat-3">③番</div>`
                : (getDayType(new Date()) === 'weekday'
                    ? `<div class="platform plat-12">①②番</div>`
                    : ''))
            : '';

        return `<div class="card ${isNextTrain ? 'first' : ''} ${isPast ? 'past' : ''}">
            <div class="card-left">
                ${isNextTrain ? '<div class="card-label">次の電車</div>' : ''}
                <div class="card-times">
                    <div class="card-time">${pad(t.hr)}:${pad(t.min)}</div>
                    <div class="card-arrival">${arrivalHtml}</div>
                </div>
                ${connHtml}
                <div class="card-wait">${wait}</div>
            </div>
            <div class="card-dest">
                <div class="dest ${cls}">${label}</div>
                ${platHtml}
            </div>
        </div>`;
    }).join('');
}

function showNext()    {
    const all = getAllTrains();
    renderAt(Math.max(0, all.findIndex(t => t.diff > 0)));
}
function showForward() { if (trainShown) renderAt(trainOffset + 1); }
function showPrev()    { if (trainShown) renderAt(trainOffset - 1); }

updateClock();
setInterval(updateClock, 15000);
</script>
